name: Deploy Papyrus

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # lets the workflow save notes.json (it stores each note's added date)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, needed for each note's first-commit date

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rebuild notes.json
        run: node update-manifest.js

      - name: Save notes.json back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes.json
          if git diff --cached --quiet; then
            echo "notes.json unchanged"
          else
            git commit -m "chore: update notes.json [skip ci]"
            git push || echo "::warning::could not push notes.json (branch protection?)"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
